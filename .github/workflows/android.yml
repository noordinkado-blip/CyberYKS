name: Build CyberYKS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            python3-pip python3-venv \
            openjdk-17-jdk \
            build-essential \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libffi-dev libssl-dev \
            libltdl-dev cmake

      - name: Setup Python
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install buildozer cython==0.29.36

      - name: Build APK
        run: |
          .venv/bin/buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberYKS-APK
          path: bin/*.apk
